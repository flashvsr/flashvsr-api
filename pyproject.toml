[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flashvsr-api"
version = "0.1.0"
description = "Python client for a FlashVSR-style super-resolution API: diffusion-based upscaling through a hosted SeedVR2 endpoint"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "flashvsr"}]
keywords = ["ai api", "flashvsr", "flashvsr api", "flashvsr python", "seedvr2-upscale", "synexa"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/flashvsr/flashvsr-api"
Documentation = "https://flashvsr.github.io/flashvsr-api/"
"Hosted model" = "https://synexa.ai/explore/bytedance/seedvr2-upscale?utm_source=github&utm_medium=ugc&utm_campaign=flashvsr&utm_content=pyproject&utm_term=tier-a"

[tool.setuptools.packages.find]
include = ["flashvsr_api*"]
